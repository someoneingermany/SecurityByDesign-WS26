name: Build & Publish

# Feld 1 (Building, Vertiefung): Ein Merge in den Deploy-Branch (main) baut das
# Container-Image automatisiert und veröffentlicht es in der GitHub Container
# Registry (GHCR). Das veröffentlichte Image ist direkt installier-/ausführbar:
#   docker run -e ADMIN_PASSWORD=... ghcr.io/<org>/notizen-api:latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # zum Push in GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bei GHCR anmelden
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten/Tags bestimmen
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Image bauen und pushen
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
