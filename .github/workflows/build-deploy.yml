name: Build & Publish

# Feld 1 (Building, Zusatz, nicht als Vertiefung gewertet): Ein Merge in den
# Deploy-Branch (main) baut das Container-Image automatisiert und veröffentlicht
# es in der GitHub Container Registry (GHCR).
# Feld 3 (SBOM): Zu jedem veröffentlichten Image entsteht automatisch eine SBOM.
# Das veröffentlichte Image lässt sich direkt starten:
#   docker run -e ADMIN_PASSWORD=... ghcr.io/someoneingermany/securitybydesign-ws26:latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # zum Push in GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bei GHCR anmelden
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten/Tags bestimmen
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Image bauen und pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: SBOM des veröffentlichten Images erzeugen (Syft, CycloneDX)
        # Feld 3: Zutatenliste aller Pakete im Image, inklusive der Debian-Pakete
        # des Basis-Images. Abrufbar als Artefakt am jeweiligen Workflow-Lauf.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-notizen-api.cdx.json
          upload-release-assets: false